      required: [prompt, vendors, comparisonIdentity, category, recommendation, score, status, createdAt, urls, sourceAvailability, criteria, executiveSummary, recommendationReason, confirmedRecommendation, alternatives, vendorScores, pricing, features, swot, opportunities, insights, nextSteps, contextAssumptions, productEquivalency, functionalGaps, serviceProductMap, migrationSequence, decisionGovernance]
    ComparisonWithDraftCorrelation:
      allOf:
        - $ref: "#/components/schemas/Comparison"
        - $ref: "#/components/schemas/DraftRequestCorrelation"
    GuestComparisonWithDraftCorrelation:
