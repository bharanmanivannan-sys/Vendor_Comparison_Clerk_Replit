openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: |
    API-only white-label service for researched, metered product comparisons.

    Customer applications authenticate `/v1` operations with a tenant-scoped API key:
    `Authorization: Bearer vc_beta_...`. Calls are designed for a customer's backend,
    workflow runner, or agent service; API keys must never be exposed in a branded
    browser or mobile client. Responses are presentation-neutral structured JSON so
    customers can apply their own brand, terminology, interaction design, and reports.
    Account and API-key management operations use a signed-in Clerk session and, where
    documented, `X-Tenant-Id`.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: comparisons
    description: Vendor and product comparison operations
  - name: analytics
    description: Privacy-preserving traction analytics
paths:
  /comparison-drafts/interpret:
    post:
      operationId: interpretComparisonDraft
      tags: [comparisons]
      summary: Interpret and persist a fast comparison draft
      description: Local deterministic interpretation only; this operation does not perform research. Requires a request correlation header and echoes draftId, draftVersion, and requestId on the draft response. If idempotencyKey is omitted, the server assigns a unique key when creating the draft.
      parameters:
        - $ref: "#/components/parameters/DraftRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComparisonDraftInterpretInput"
      responses:
        "201":
          description: Persisted draft created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComparisonDraft"
        "200":
          description: Existing draft returned for the idempotency key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComparisonDraft"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComparisonDraftError"
        "409":
          description: Idempotency conflict or an older draft still needing concrete option discovery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComparisonDraftError"
        "503":
          description: Persistence or bounded competitor discovery unavailable; retry setup or edit concrete options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComparisonDraftError"
  /comparison-drafts/{id}:
    get:
      operationId: getComparisonDraft
      tags: [comparisons]
      summary: Fetch the current owner-scoped comparison draft
      description: Requires a UUID X-Request-Id header and echoes draftId, draftVersion, and requestId with the current draft. The optional draftVersion query parameter can assert the expected version; a mismatch returns 409.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/DraftRequestId"
      responses:
        "200":
          description: Current persisted draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComparisonDraft"
        "400":
          description: Invalid or missing X-Request-Id or a mismatched expected draft version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComparisonDraftError" }
        "404":
          description: Draft not found for this owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComparisonDraftError"
    patch:
      operationId: updateComparisonDraftOptions
      tags: [comparisons]
      summary: Save local review edits to an owned comparison draft
      description: >-
        Requires a UUID X-Request-Id, an Idempotency-Key, and the current
         draftVersion. Options, criteria, market/currency, URL rows, and
         includeClosingProducts may be saved together; each supplied field is
         validated locally and URLs are never fetched. Option edits create new
         option IDs. Criteria and URL-only edits preserve option IDs and order.
         Option or market edits invalidate prior market proof, source
         associations, preflight results, suggestions, and older enrichment
         jobs. Replays require the same key and edit body at the current version.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/DraftRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComparisonDraftOptionEditInput"
      responses:
        "200":
          description: Saved draft; echoes the new draftVersion and this requestId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComparisonDraft"
        "400":
          description: Invalid or missing X-Request-Id, Idempotency-Key, draftVersion, or local review edits
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComparisonDraftError" }
        "404":
          description: Draft not found for this owner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComparisonDraftError" }
        "409":
          description: Draft version is stale or Idempotency-Key was reused for a different edit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComparisonDraftError" }
  /comparison-drafts/{id}/options/{optionId}/suggestions:
    get:
      operationId: getComparisonDraftOptionSuggestions
      tags: [comparisons]
      summary: Get fast contextual suggestions for one draft option
      description: Requires a UUID X-Request-Id and echoes draftId, draftVersion, requestId, and the requested optionId so suggestions can only be applied to that draft option. The optional draftVersion query parameter can assert the expected version; a mismatch returns 409. An optional typedText query may provide current safely validated text of 2-120 characters to contextualize suggestions; the accepted value is described here rather than as a generated operation parameter to avoid a TypeScript *Params export collision.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: optionId
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/DraftRequestId"
      responses:
        "200":
          description: Context-ranked local identity suggestions; market status is explicitly unverified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComparisonDraftSuggestions"
        "400":
          description: Invalid or missing X-Request-Id or a stale expected draft version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComparisonDraftError" }
        "404":
          description: Draft or option not found for this owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComparisonDraftError"
  /comparison-drafts/{id}/enrichment-jobs:
    post:
      operationId: startComparisonDraftEnrichment
      tags: [comparisons]
      summary: Queue targeted enrichment for a persisted draft
      description: Submit the current draftVersion and a UUID X-Request-Id. The queued response echoes draftId, the new draftVersion, and requestId.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/DraftRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComparisonDraftEnrichmentInput" }
      responses:
        "202":
          description: Enrichment job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComparisonDraftEnrichmentJob"
        "400":
          description: Invalid or missing X-Request-Id or draftVersion
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComparisonDraftError" }
        "409":
          description: Draft version changed before enrichment could be queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComparisonDraftError" }
        "404":
          description: Draft not found for this owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComparisonDraftError"
  /comparison-draft-enrichment-jobs/{jobId}:
    get:
      operationId: getComparisonDraftEnrichmentJob
      tags: [comparisons]
      summary: Poll queued enrichment job status
      description: Requires a UUID X-Request-Id for this poll and echoes the current draftId, draftVersion, and requestId. Optional draftId and draftVersion query parameters assert the expected draft association; a mismatch returns 409.
      parameters:
        - in: path
          name: jobId
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/DraftRequestId"
      responses:
        "200":
          description: Current job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComparisonDraftEnrichmentJobStatus"
        "400":
          description: Invalid or missing X-Request-Id or mismatched draft correlation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComparisonDraftError" }
        "409":
          description: Job does not match the supplied draft correlation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComparisonDraftError" }
        "404":
          description: Job not found for this owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComparisonDraftError"
  /comparison-drafts/{id}/urls/{urlId}/validate:
    post:
      operationId: validateComparisonDraftUrl
      tags: [comparisons]
      summary: Validate one optional URL associated with a comparison draft
      description: Requires a UUID X-Request-Id and echoes draftId, draftVersion, requestId, urlId, the checked URL, requestedUrl, and its required optionId; a URL never resolves or changes comparison identity.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: urlId
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/DraftRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComparisonDraftUrlValidationInput"
      responses:
        "200":
          description: One URL was safely preflighted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComparisonDraftUrlValidation"
        "400":
          description: Invalid URL request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComparisonDraftError"
        "409":
          description: URL identifier conflicts or draft version changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComparisonDraftError"
        "404":
          description: Draft not found for this owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComparisonDraftError"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [comparisons]
      summary: Get comparison workspace summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyErrorResponse"
  /visitor-session:
    post:
      operationId: recordVisitorSession
      tags: [analytics]
      summary: Record one pseudonymized browser session for traction analytics
      responses:
        "204":
          description: Session recorded
  /comparisons:
    get:
      operationId: listComparisons
      tags: [comparisons]
      summary: List the signed-in user's comparison history
      responses:
        "200":
          description: Comparisons from the last 30 days
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ComparisonSummary"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyErrorResponse"
    post:
      operationId: createComparison
      tags: [comparisons]
      summary: Create and analyze a new vendor comparison
      description: Requires a UUID X-Request-Id and a confirmed draft handoff. Successful report and asynchronous job responses echo draftId, draftVersion, and requestId.
      parameters:
        - $ref: "#/components/parameters/DraftRequestId"
        - name: Prefer
          in: header
          required: false
          description: Set to respond-async to start a durable, idempotent comparison job instead of waiting for synchronous analysis.
          schema:
            type: string
            example: respond-async
        - name: Idempotency-Key
          in: header
          required: false
          description: "Required with Prefer: respond-async. Must contain 8 to 100 alphanumeric or hyphen characters."
          schema:
            type: string
            pattern: "^[a-zA-Z0-9-]{8,100}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComparisonInput"
      responses:
        "201":
          description: Comparison analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComparisonWithDraftCorrelation"
        "202":
          description: Asynchronous comparison job is still researching or has produced a partial result
          headers:
            Location:
              description: Pollable comparison job resource
              schema: { type: string, example: /api/comparison-jobs/00000000-0000-4000-8000-000000000000 }
            X-Comparison-Job-Id:
              description: Comparison job identifier
              schema: { type: string, format: uuid }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComparisonJobState"
        "400":
          description: Invalid comparison input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyErrorResponse"
        "409":
          description: Idempotency key was reused with a different request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyErrorResponse"
        "503":
          description: Existing request is still in progress but has no live job in this process, or the job did not reach a terminal state within the wait budget
          headers:
            Retry-After:
              description: Suggested delay before retrying
              schema: { type: string, example: "5" }
            Location:
              description: Pollable comparison job URL when available
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyErrorResponse"
  /guest/comparisons:
    post:
      operationId: createGuestComparison
      tags: [comparisons]
      summary: Create an unsaved guest vendor comparison
      description: Requires a UUID X-Request-Id and a confirmed draft handoff. The response echoes draftId, draftVersion, and requestId.
      parameters:
        - $ref: "#/components/parameters/DraftRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComparisonInput"
      responses:
        "200":
          description: Unsaved comparison analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestComparisonWithDraftCorrelation"
        "400":
          description: Invalid comparison input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyErrorResponse"
        "429":
          description: Guest usage limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyErrorResponse"
  /comparisons/suggest:
    post:
      operationId: suggestComparisonOptions
      tags: [comparisons]
      summary: Suggest comparison identities using the decision context
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComparisonSuggestInput" }
      responses:
        "200":
          description: Contextual suggestions; availability is not asserted unless evidence is available
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComparisonSuggestResponse" }
        "400":
          description: Invalid suggestion input
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegacyErrorResponse" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegacyErrorResponse" }
  /guest/comparisons/suggest:
    post:
      operationId: suggestGuestComparisonOptions
      tags: [comparisons]
      summary: Suggest comparison identities for a guest using decision context
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComparisonSuggestInput" }
      responses:
        "200":
          description: Contextual suggestions; availability is not asserted unless evidence is available
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComparisonSuggestResponse" }
        "400":
          description: Invalid suggestion input
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegacyErrorResponse" }
        "429":
          description: Guest usage limit reached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegacyErrorResponse" }
  /comparisons/parse:
    post:
      operationId: parseComparisonPrompt
      tags: [comparisons]
      summary: Parse a natural language comparison request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComparisonPromptInput"
      responses:
        "200":
          description: Parsed comparison request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParsedComparison"
        "400":
          description: Invalid prompt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyErrorResponse"
  /comparisons/review:
    post:
      operationId: reviewComparisonContext
      tags: [comparisons]
      summary: Revalidate edited comparison context before research
      description: Requires a UUID X-Request-Id and the owned draftId/draftVersion. The validated response echoes the draft correlation tuple.
      parameters:
        - $ref: "#/components/parameters/DraftRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComparisonInput"
      responses:
        "200":
          description: Validated comparison context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComparisonReview"
        "400":
          description: Invalid comparison context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyErrorResponse"
        "404":
          description: Confirmed draft not found for this account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegacyErrorResponse" }
        "409":
          description: Draft version is stale
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegacyErrorResponse" }
  /comparisons/source-preflight:
    post:
      operationId: preflightComparisonSources
      tags: [comparisons]
      summary: Validate supplied sources before authenticated research
      description: Requires a UUID X-Request-Id and confirmed draft handoff; the response echoes draftId, draftVersion, and requestId.
      parameters:
        - $ref: "#/components/parameters/DraftRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourcePreflightInput"
      responses:
        "200":
          description: Source-by-source validation results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourcePreflightResponse"
        "400":
          description: Invalid source validation input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyErrorResponse"
        "404":
          description: Confirmed draft not found for this account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegacyErrorResponse" }
        "409":
          description: Draft version or confirmed handoff is stale or mismatched
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegacyErrorResponse" }
  /guest/comparisons/parse:
    post:
      operationId: parseGuestComparisonPrompt
      tags: [comparisons]
      summary: Parse a guest comparison prompt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComparisonPromptInput"
      responses:
        "200":
          description: Parsed comparison request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParsedComparison"
        "400":
          description: Invalid prompt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyErrorResponse"
        "429":
          description: Guest usage limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyErrorResponse"
  /guest/comparisons/review:
    post:
      operationId: reviewGuestComparisonContext
      tags: [comparisons]
      summary: Revalidate an edited guest comparison before research
      description: Requires a UUID X-Request-Id and the guest-owned draftId/draftVersion. The validated response echoes the draft correlation tuple.
      parameters:
        - $ref: "#/components/parameters/DraftRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComparisonInput"
      responses:
        "200":
          description: Validated comparison context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComparisonReview"
        "400":
          description: Invalid comparison context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyErrorResponse"
        "404":
          description: Confirmed guest draft not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegacyErrorResponse" }
        "409":
          description: Draft version is stale
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegacyErrorResponse" }
  /guest/comparisons/source-preflight:
    post:
      operationId: preflightGuestComparisonSources
      tags: [comparisons]
      summary: Validate supplied sources before guest research
      description: Requires a UUID X-Request-Id and confirmed draft handoff; the response echoes draftId, draftVersion, and requestId.
      parameters:
        - $ref: "#/components/parameters/DraftRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourcePreflightInput"
      responses:
        "200":
          description: Source-by-source validation results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourcePreflightResponse"
        "400":
          description: Invalid source validation input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyErrorResponse"
        "429":
          description: Guest usage limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyErrorResponse"
        "404":
          description: Confirmed guest draft not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegacyErrorResponse" }
        "409":
          description: Draft version or confirmed handoff is stale or mismatched
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegacyErrorResponse" }
  /comparison-jobs:
    post:
      operationId: createComparisonJob
      tags: [comparisons]
      summary: Start an authenticated comparison research job
      description: Requires a UUID X-Request-Id and confirmed draft handoff. The accepted job response echoes draftId, draftVersion, and requestId.
      parameters:
        - $ref: "#/components/parameters/DraftRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComparisonInput"
      responses:
        "202":
          description: Comparison research job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComparisonJobAccepted"
        "400":
          description: Invalid comparison input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyErrorResponse"
        "404":
          description: Confirmed draft not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegacyErrorResponse" }
        "409":
          description: Draft version or confirmed handoff is stale or mismatched
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegacyErrorResponse" }
  /comparison-jobs/retryable:
    get:
      operationId: listRetryableComparisonJobs
      tags: [comparisons]
      summary: List recent failed market checks that can be retried from the unchanged owned draft
      responses:
        "200":
          description: Retryable failed jobs. A retry is a new comparison attempt and rechecks market proof.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetryableComparisonJobs"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyErrorResponse"
  /comparison-jobs/{id}:
    get:
      operationId: getComparisonJob
      tags: [comparisons]
      summary: Get an authenticated comparison research job
      description: Requires a UUID X-Request-Id and echoes the job's draftId, draftVersion, and requestId. The optional draftId and draftVersion query parameters reject a poll for the wrong confirmed draft; these optional guards are documented here to avoid generated operation-parameter type-name collisions.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
