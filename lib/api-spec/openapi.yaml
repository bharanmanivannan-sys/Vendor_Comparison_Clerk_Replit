        - $ref: "#/components/schemas/GuestComparison"
        - $ref: "#/components/schemas/DraftRequestCorrelation"
    DecisionAdvice:
      type: object
      description: Decision summary derived from the persisted scorecard. Confidence is a heuristic, not a probability.
      required: [decisionType, winner, runnerUp, provisional, confidence, whyItWon, bestFor, notRecommendedIf, tradeoffs, scenarioLeaders]
      properties:
        decisionType: { type: string }
        winner: { type: string }
        runnerUp: { type: string }
        provisional: { type: boolean }
        confidence:
          type: object
          required: [score, band, dataCoverage, sourceConsistency, scoreSeparation, priorityClarity, basis]
          properties:
            score: { type: integer, minimum: 0, maximum: 100 }
            band: { type: string, enum: [Low, Moderate, High] }
            dataCoverage: { type: integer, minimum: 0, maximum: 100 }
            sourceConsistency: { type: integer, minimum: 0, maximum: 100 }
            scoreSeparation: { type: integer, minimum: 0, maximum: 100 }
            priorityClarity: { type: integer, minimum: 0, maximum: 100 }
            basis: { type: string }
        whyItWon: { type: string }
        bestFor: { type: string }
        notRecommendedIf: { type: string }
        tradeoffs:
          type: array
          items: { type: string }
        scenarioLeaders:
          type: array
          items:
            type: object
            required: [lens, leader]
            properties:
              lens: { type: string }
              leader: { type: string }
    ConfirmedRecommendation:
      type: object
      properties:
        status:
          type: string
          enum: [CONFIRMED, PROVISIONAL, NO_CONFIRMED_RECOMMENDATION]
        option:
          type: [string, "null"]
        score:
          type: [integer, "null"]
          minimum: 0
          maximum: 100
        basis:
          type: string
          enum: [QUALIFIED, QUALIFIED_WITH_CONDITIONS, EVIDENCE_LIMITED, NONE]
        rationale:
          type: string
      required: [status, option, score, basis, rationale]
    ComparedAlternative:
      type: object
      properties:
        option:
          type: string
        rank:
          type: integer
          minimum: 1
        score:
          type: [integer, "null"]
          minimum: 0
          maximum: 100
        scoreDifference:
          type: [integer, "null"]
          minimum: 0
          maximum: 100
        qualificationStatus:
          type: string
        rationale:
          type: string
      required: [option, rank, score, scoreDifference, qualificationStatus, rationale]
    ReportSource:
      type: object
      properties:
        url:
          type: string
          format: uri
        status:
          type: string
          enum: [reachable, restricted, timed_out, unavailable, superseded]
        reason:
          type: string
        replacementUrl:
          type: string
          format: uri
        accessStatus:
          type: string
          enum: [ALLOWED, LICENSED, CUSTOMER_SUPPLIED, ACCESS_UNAVAILABLE, PROHIBITED]
        accessMethod:
          type: string
          enum: [public_web, customer_url, api, feed, upload]
        checkedAt:
          type: string
          format: date-time
        primaryContext:
          type: boolean
        restrictions:
          type: array
          items:
            type: string
        registryDecision:
          $ref: "#/components/schemas/SourceRegistryDecision"
      required: [url, status, reason]
    SourceRegistryDecision:
      type: object
      properties:
        domain:
          type: string
        decisionOrigin:
          type: string
          enum: [reviewed, automated]
        pathScope:
          type: string
        sourceType:
          type: string
          enum: [publisher, official, regulator, standards, customer]
        accessStatus:
          type: string
          enum: [ALLOWED, LICENSED, CUSTOMER_SUPPLIED, ACCESS_UNAVAILABLE, PROHIBITED]
        accessMethod:
          type: string
          enum: [public_web, customer_url, api, feed, upload]
        robotsResult:
          type: string
          enum: [allowed, disallowed, unavailable, not_applicable]
        licenceOrTermsNotes:
          type: string
        owner:
          type: string
        reviewedAt:
          type: string
          format: date-time
        reviewDueAt:
          type: string
          format: date-time
        allowedUses:
          type: array
          items:
            type: string
        restrictions:
          type: array
          items:
            type: string
      required: [domain, decisionOrigin, sourceType, accessStatus, accessMethod, robotsResult, reviewedAt, reviewDueAt, allowedUses, restrictions]
    VendorScore:
      type: object
      properties:
        vendor:
          type: string
        score:
          type: number
        color:
          type: string
        verdict:
          type: string
        marketEligibility:
          $ref: "#/components/schemas/MarketEligibility"
        marketRelevance:
          $ref: "#/components/schemas/MarketRelevanceAssessment"
        providerRole:
          type: string
          description: Strategic market role of the product, service, or brand in this decision context.
          enum: [accelerator, leader, core_provider, expert]
        providerRoleRationale:
          type: string
          description: Evidence-based explanation for the assigned strategic market role.
        weightedScores:
          type: array
          items:
            $ref: "#/components/schemas/WeightedCriterionScore"
        modelScore:
          type: number
          minimum: 0
          maximum: 100
          description: Overall score from the qualification model. Absent when the option is not qualified or evidence is insufficient.
        qualificationStatus:
          type: string
          description: Qualification outcome based on mandatory gates and validated evidence.
          enum: [QUALIFIED, QUALIFIED_WITH_CONDITIONS, NOT_QUALIFIED, INSUFFICIENT_EVIDENCE]
        qualificationGates:
          type: array
          items:
            $ref: "#/components/schemas/QualificationGate"
        dimensionScores:
          type: array
          items:
            $ref: "#/components/schemas/VendorDimensionScore"
        evidenceConfidence:
          type: number
          minimum: 0
          maximum: 100
        evidenceCoverage:
          type: number
          minimum: 0
          maximum: 100
        strengths:
          type: array
          items: { type: string }
        gaps:
          type: array
          items: { type: string }
        conditions:
          type: array
          items: { type: string }
        limitations:
          type: array
          items: { type: string }
        switchConditions:
          type: array
          description: Conditions under which this option should be preferred over the overall recommendation.
          items:
            type: string
        vrio:
          $ref: "#/components/schemas/VrioAssessment"
        marketPosition:
          $ref: "#/components/schemas/MarketPosition"
        marketHistory:
          $ref: "#/components/schemas/MarketHistory"
      required: [vendor, score, color, verdict]
    MarketEligibility:
      type: object
      description: Eligibility and new-customer acquisition status for the exact provider, product, market, customer segment, and effective date.
      properties:
        status:
          type: string
          enum: [ELIGIBLE, LIMITED, CLOSING, INELIGIBLE, UNKNOWN]
          description: Market/product eligibility outcome; this is independent of supporting evidence verification.
        evidenceStatus:
          type: string
          description: Verification state of evidence supporting the eligibility decision.
          enum: [CONFIRMED, VERIFIED, INCOMPLETE, MISSING, CONFLICTING, TIMED_OUT]
        basis:
          type: string
          description: Basis for the eligibility classification.
          enum: [OFFICIAL_DOCUMENT, KNOWN_OFFERING, UNESTABLISHED]
        newApplicationAcceptance:
          type: string
          description: Whether current acceptance of new applications is verified. KNOWN_OFFERING can establish market participation while this remains UNVERIFIED.
          enum: [VERIFIED, UNVERIFIED]
        newCustomerStatus:
          type: string
          description: Current new-customer acquisition state, separate from category/market participation.
          enum: [OPEN, RESTRICTED, CLOSING, CLOSED, UNKNOWN]
        market: { type: string }
        product: { type: string }
        customerSegment: { type: string }
        subcategory: { type: string }
        effectiveDate: { type: string, format: date }
        reason: { type: string }
        checkedAt: { type: string, format: date-time }
        sourceUrl: { type: string, format: uri }
        exactClaim: { type: string }
      required: [status, market, product, reason, checkedAt]
    MarketRelevanceAssessment:
      type: object
      description: Decision-specific geographic and demographic relevance. This is distinct from market eligibility and never inferred from a source URL.
      properties:
        optionId: { type: string }
        optionName:
          type: string
          description: User-confirmed option display name associated with this assessment.
        market:
          $ref: "#/components/schemas/DemographicContext"
        availabilityStatus:
          type: string
          enum: [LOCALLY_AVAILABLE, ONLINE_LOCALLY_AVAILABLE, CROSS_BORDER_AVAILABLE, DIGITALLY_AVAILABLE, LIMITED_AVAILABILITY, NOT_AVAILABLE, NOT_VERIFIED]
        demographicRelevanceStatus:
          type: string
          enum: [HIGH, MODERATE, LOW, NOT_RELEVANT, NOT_ASSESSED]
        participationStatus:
          type: string
          enum: [ELIGIBLE, CONDITIONALLY_ELIGIBLE, INELIGIBLE, CLARIFICATION_REQUIRED]
        relevanceScore: { type: number, minimum: 0, maximum: 100 }
        relevantForObjective: { type: ["boolean", "null"] }
        localPhysicalPresence: { type: ["boolean", "null"] }
        localOnlinePresence: { type: ["boolean", "null"] }
        crossBorderAccess: { type: ["boolean", "null"] }
        digitalAccess: { type: ["boolean", "null"] }
        localPricingAvailable: { type: ["boolean", "null"] }
        localSupportAvailable: { type: ["boolean", "null"] }
        mandatoryGateResults:
          type: array
          items:
            type: object
            properties:
              gate:
                type: string
                enum: [MARKET_AVAILABILITY, PHYSICAL_STORE_REQUIRED, ROUTE_SERVICEABILITY, ENTERPRISE_DATA_RESIDENCY, CUSTOMER_SEGMENT, REGULATORY_REQUIREMENT, LOCAL_RETURNS_REQUIRED]
              status:
                type: string
                enum: [PASS, FAIL, CONDITIONAL, NOT_APPLICABLE]
              mandatory: { type: boolean }
              reason: { type: string }
              evidenceIds:
                type: array
                items: { type: string }
            required: [gate, status, mandatory, reason, evidenceIds]
        evidence:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              optionId: { type: string }
              gate:
                type: string
                enum: [MARKET_AVAILABILITY, PHYSICAL_STORE_REQUIRED, ROUTE_SERVICEABILITY, ENTERPRISE_DATA_RESIDENCY, CUSTOMER_SEGMENT, REGULATORY_REQUIREMENT, LOCAL_RETURNS_REQUIRED]
              outcome: { type: string, enum: [PASS, FAIL] }
              country: { type: string }
              location: { type: string }
              accessMode: { type: string, enum: [PHYSICAL_STORE, LOCAL_ONLINE, CROSS_BORDER, DIGITAL] }
              sourceUrl: { type: string, format: uri }
              sourceTitle: { type: string }
              publisher: { type: string }
              exactClaim: { type: string }
              retrievedAt: { type: string, format: date-time }
              currentMarketSpecific: { type: boolean }
            required: [id, optionId, gate, outcome, country, sourceUrl, exactClaim, retrievedAt, currentMarketSpecific]
        assumptions:
          type: array
          items: { type: string }
        limitations:
          type: array
          items: { type: string }
        explanation: { type: string }
        assessedAt: { type: string, format: date-time }
        researchStatus: { type: string, enum: [COMPLETE, PARTIAL_TIMEOUT] }
      required: [optionId, market, availabilityStatus, demographicRelevanceStatus, participationStatus, relevantForObjective, mandatoryGateResults, evidence, assumptions, limitations, explanation, assessedAt]
    QualificationGate:
      type: object
      properties:
        gate: { type: string }
        status:
          type: string
          enum: [PASS, CONDITIONAL, FAIL, UNKNOWN, NOT_APPLICABLE]
        mandatory: { type: boolean }
        rationale: { type: string }
        evidenceSourceIds:
          type: array
          items: { type: string }
      required: [gate, status, mandatory, rationale, evidenceSourceIds]
    VendorDimensionScore:
      type: object
      properties:
        dimension:
          type: string
          enum: ["Requirements Fit", "Price and Total Value", "Feature and Capability Strength", "Service, Ownership and Support", "Evidence Confidence"]
        weight:
          type: integer
          enum: [30, 25, 25, 10, 10]
        score:
          type: number
          minimum: 0
          maximum: 100
        coverage:
          type: number
          minimum: 0
          maximum: 100
        coverageStatus:
          type: string
          enum: [SUPPRESSED, PROVISIONAL, LIMITED_CONFIDENCE, SUFFICIENTLY_SUPPORTED]
        supportedSubcriteria:
          type: integer
          minimum: 0
        totalSubcriteria:
          type: integer
          minimum: 0
        rationale: { type: string }
      required: [dimension, weight, coverage, coverageStatus, supportedSubcriteria, totalSubcriteria, rationale]
    VrioDimension:
      type: object
      properties:
        status:
          type: string
          enum: [strong, partial, weak, not_applicable]
        rationale:
          type: string
      required: [status, rationale]
    VrioAssessment:
      type: object
      properties:
        value:
          $ref: "#/components/schemas/VrioDimension"
        rarity:
          $ref: "#/components/schemas/VrioDimension"
        imitability:
          $ref: "#/components/schemas/VrioDimension"
        organization:
          $ref: "#/components/schemas/VrioDimension"
        implication:
          type: string
      required: [value, rarity, imitability, organization, implication]
    MarketPosition:
      type: object
      properties:
        marketShare:
          type: string
          description: Latest credible market-share figure or an explicit unavailable statement.
        marketSharePeriod:
          type: string
        market:
          type: string
        shareValue:
          type: string
          description: Public parent-company share price/value when applicable, otherwise Not applicable.
        shareValueAsOf:
          type: string
        applicability:
          type: string
        evidence:
          type: string
      required: [marketShare, marketSharePeriod, market, shareValue, shareValueAsOf, applicability, evidence]
    MarketHistory:
      type: object
      description: Evidence-backed five-year performance, ownership, corporate-action, and listed-stock context for one compared option.
      properties:
        lookbackYears:
          type: integer
          const: 5
        trendSummary:
          type: string
        yearlyTrends:
          type: array
          items: { $ref: "#/components/schemas/MarketHistoryYear" }
        ownership:
          $ref: "#/components/schemas/OwnershipSnapshot"
        transactions:
          type: array
          items: { $ref: "#/components/schemas/CorporateTransaction" }
        stock:
          $ref: "#/components/schemas/StockHistory"
      required: [lookbackYears, trendSummary, yearlyTrends, ownership, transactions, stock]
    MarketHistoryYear:
      type: object
      properties:
        year: { type: integer }
        productPerformance: { type: string }
        marketPosition: { type: string }
        trendDirection:
          type: string
          enum: [improving, stable, declining, mixed, unavailable]
        notableEvent: { type: string }
        evidenceUrl: { type: string, format: uri }
      required: [year, productPerformance, marketPosition, trendDirection, notableEvent]
    OwnershipSnapshot:
      type: object
      properties:
        status:
          type: string
          enum: [public, private, subsidiary, government, mutual, unknown]
        ultimateParent: { type: string }
        majorShareholders:
          type: array
          items: { type: string }
        asOf: { type: string }
        evidenceUrl: { type: string, format: uri }
      required: [status, ultimateParent, majorShareholders, asOf]
    CorporateTransaction:
      type: object
      properties:
        date: { type: string }
        type:
          type: string
          enum: [merger, acquisition, divestiture, investment, restructure, none_found]
        counterparty: { type: string }
        summary: { type: string }
        impact: { type: string }
        evidenceUrl: { type: string, format: uri }
      required: [date, type, counterparty, summary, impact]
    StockHistory:
      type: object
      properties:
        applicability:
          type: string
          enum: [listed, listed_parent, private, not_applicable, unverified]
        ticker: { type: string }
        exchange: { type: string }
        currency: { type: string }
        latestPrice:
          type: [number, "null"]
        latestPriceAsOf: { type: string }
        fiveYearChangePercent:
          type: [number, "null"]
        yearlyCloses:
          type: array
          items: { $ref: "#/components/schemas/StockYearClose" }
        evidenceUrl: { type: string, format: uri }
      required: [applicability, ticker, exchange, currency, latestPrice, latestPriceAsOf, fiveYearChangePercent, yearlyCloses]
    StockYearClose:
      type: object
      properties:
        year: { type: integer }
        price:
          type: [number, "null"]
      required: [year, price]
    WeightedCriterionScore:
      type: object
      properties:
        criterion:
          type: string
        weight:
          type: number
        score:
          type: integer
          minimum: 0
          maximum: 100
        rationale:
          type: string
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/ScoreEvidence"
      required: [criterion, weight, score, rationale]
    ScoreEvidence:
      type: object
      properties:
        sourceId:
          type: string
          description: Application-issued identifier for validated document provenance. Never a model-supplied URL.
          pattern: "^docsha256:[a-f0-9]{64}$"
        sourceUrl:
          type: string
          format: uri
        sourceTitle:
          type: string
        sourcePublisher:
          type: string
        sourceDate:
          type: string
          format: date
        retrievalDate:
          type: string
          format: date
        exactClaim:
          type: string
        metricKey:
          type: string
          description: Stable server-controlled measure identifier shared across vendors, such as price, baas_upfront_price, usage_cost_per_km, ground_clearance, variable_interest_rate, or annual_fee.
        rawMetricValue:
          type: number
        rawMetricUnit:
          type: string
        normalizationDirection:
          type: string
          enum: [higher_is_better, lower_is_better]
        documentSha256:
          type: string
          description: SHA-256 of the normalized visible text retrieved by the server. Required for evidence used in deterministic quantitative scoring.
          pattern: "^[a-f0-9]{64}$"
        sourceTextStart:
          type: integer
          description: Zero-based start offset of the verified claim in normalized retrieved text.
          minimum: 0
        sourceTextEnd:
          type: integer
          description: Exclusive end offset of the verified claim in normalized retrieved text.
          minimum: 1
        metricSubject:
          type: string
          description: Product or provider identity derived from text structurally associated with the verified claim.
        metricBasis:
          type: string
          description: Server-derived comparability dimensions such as test standard, capacity type, AC/DC mode, charge window, LVR and borrower type, market and period, or population and period.
        sampleSize:
          type: integer
          minimum: 0
        evidenceKind:
          type: string
          enum: [quantitative, percentage, qualitative, analyst_judgment, unverified]
        supportDirection:
          type: string
          enum: [supports, contradicts, context, neutral]
        confidence:
          type: integer
          minimum: 0
          maximum: 100
        normalizedScore:
          type: integer
          minimum: 0
          maximum: 100
        criterionWeight:
          type: integer
          minimum: 0
          maximum: 100
        weightedContribution:
          type: number
        normalizationMethod:
          type: string
          description: How the score contribution was produced. Deterministic quantitative scoring requires retrieved_document_metric provenance before applying a direct or inverse comparable-metric normalization.
      required: [retrievalDate, exactClaim, evidenceKind, supportDirection, confidence, normalizedScore, criterionWeight, weightedContribution, normalizationMethod]
    AnalysisRow:
      type: object
      properties:
        dimension:
          type: string
        values:
          type: object
          additionalProperties:
            type: string
        winner:
          type: string
      required: [dimension, values, winner]
    ProductEquivalencyItem:
      type: object
      properties:
        capability: { type: string }
        currentArrangement: { type: string }
        targetArrangement: { type: string }
        equivalency: { type: string, description: Full, partial, no direct equivalent, or unverified, with rationale. }
        gap: { type: string }
      required: [capability, currentArrangement, targetArrangement, equivalency, gap]
    FunctionalGapItem:
      type: object
      properties:
        capability: { type: string }
        currentState: { type: string }
        targetState: { type: string }
        gap: { type: string }
        mitigation: { type: string }
        severity: { type: string, enum: [low, medium, high, critical] }
      required: [capability, currentState, targetState, gap, mitigation, severity]
    ServiceProductMapItem:
      type: object
      properties:
        businessService: { type: string }
        currentProduct: { type: string }
        targetProduct: { type: string }
        dependencies: { type: string }
        owner: { type: string }
      required: [businessService, currentProduct, targetProduct, dependencies, owner]
    MigrationPhase:
      type: object
      properties:
        phase: { type: string }
        objective: { type: string }
        dependencies: { type: string }
        exitCriteria: { type: string }
        risk: { type: string, enum: [low, medium, high, critical] }
      required: [phase, objective, dependencies, exitCriteria, risk]
    BuyerQuote:
      type: object
      description: Buyer-entered terms linked to a private written quote, not independently verified.
      properties:
        vendor: { type: string }
        documentDate: { type: string, description: Calendar date YYYY-MM-DD }
        validUntil: { type: string, description: Calendar date YYYY-MM-DD }
        currency: { type: string, enum: [AUD, USD, EUR, GBP] }
        termMonths: { type: integer }
        licenseAnnual: { type: string }
        implementationOnce: { type: string }
        serviceAnnual: { type: string }
        audPerUnit: { type: string }
        exchangeRateDate: { type: string, description: Calendar date YYYY-MM-DD }
        exchangeRateSource: { type: string }
        scope: { type: string }
        taxBasis: { type: string, enum: [ex_gst, inc_gst] }
        exclusions: { type: string }
        fileName: { type: string }
        fileSha256: { type: string }
        documentUrl: { type: string }
        totalAud: { type: string }
      required: [vendor, documentDate, validUntil, currency, termMonths, licenseAnnual, implementationOnce, serviceAnnual, audPerUnit, scope, taxBasis, exclusions, fileName, fileSha256, documentUrl, totalAud]
    BuyerQuoteAssessment:
      type: object
      properties:
        status: { type: string, enum: [ready, incomplete] }
        flags: { type: array, items: { type: string } }
        horizonMonths: { type: integer }
        winner: { type: [string, "null"] }
        rows:
          type: array
          items: { $ref: "#/components/schemas/AnalysisRow" }
        scores:
          type: object
          additionalProperties: { type: integer }
      required: [status, flags, winner, rows, scores]
    BuyerQuoteBundle:
      type: object
      properties:
        quotes:
          type: array
          items: { $ref: "#/components/schemas/BuyerQuote" }
        assessment: { $ref: "#/components/schemas/BuyerQuoteAssessment" }
      required: [quotes, assessment]
    DecisionGovernanceItem:
      type: object
      properties:
        decision: { type: string }
        owner: { type: string }
        approvers: { type: string }
        evidenceRequired: { type: string }
        decisionGate: { type: string }
      required: [decision, owner, approvers, evidenceRequired, decisionGate]
    DashboardSummary:
      type: object
      properties:
        totalComparisons:
          type: integer
        thisMonth:
          type: integer
        averageScore:
          type: integer
        topCategory:
          type: string
        recentComparisons:
          type: array
          items:
            $ref: "#/components/schemas/ComparisonSummary"
      required: [totalComparisons, thisMonth, averageScore, topCategory, recentComparisons]
