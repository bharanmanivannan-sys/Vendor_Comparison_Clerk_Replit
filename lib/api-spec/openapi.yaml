          description: Exact tenant being managed; the Clerk user must be an owner or admin member.
          schema: { type: string, minLength: 1, maxLength: 200 }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /tenant/api-keys:
    get:
      operationId: listTenantApiKeys
      tags: [management]
      summary: List API key metadata
      description: List key metadata for this tenant; plaintext secrets are never returned here.
      security: [{ ClerkBearer: [] }]
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          description: Exact tenant being managed; the Clerk user must be an owner or admin member.
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200":
          description: API keys
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApiKeyMetadata" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createTenantApiKey
      tags: [management]
      summary: Create an API key (plaintext is returned once)
      description: Create a tenant-scoped key. The plaintext is returned only in this response and cannot be retrieved later.
      security: [{ ClerkBearer: [] }]
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          description: Exact tenant being managed; the Clerk user must be an owner or admin member.
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApiKeyCreateInput" }
            example:
              name: Production integration
              scopes: [comparisons:read, comparisons:write, usage:read]
      responses:
        "201":
          description: Created API key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyCreated" }
              example:
                id: 7
                name: Production integration
                prefix: vc_live_ab12
                scopes: [comparisons:read, comparisons:write, usage:read]
                expiresAt: null
                revokedAt: null
                lastUsedAt: null
                createdAt: "2026-09-15T01:00:00.000Z"
                key: vc_live_ab12_example_returned_once
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /tenant/api-keys/{id}/rotate:
    post:
      operationId: rotateTenantApiKey
      tags: [management]
      summary: Revoke an API key and issue a replacement
      description: Revoke the selected key and create a replacement whose plaintext is returned only once.
      security: [{ ClerkBearer: [] }]
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          description: Exact tenant being managed; the Clerk user must be an owner or admin member.
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "201":
          description: Replacement key, plaintext returned once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyCreated" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /tenant/api-keys/{id}/revoke:
    post:
      operationId: revokeTenantApiKey
      tags: [management]
      summary: Revoke an API key
      description: Revoke a tenant API key. Revoked keys cannot authenticate future requests.
      security: [{ ClerkBearer: [] }]
      parameters:
        - name: X-Tenant-Id
          in: header
          required: true
          description: Exact tenant being managed; the Clerk user must be an owner or admin member.
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: vc_beta_... or vc_live_...
      description: "Tenant-scoped API key. Send Authorization: Bearer vc_beta_.... Scope is documented per operation. The plaintext key is returned only when created or rotated."
    ClerkBearer:
      type: http
      scheme: bearer
      bearerFormat: Clerk session
      description: Signed-in Clerk session token for management operations only; do not use this credential for /v1 calls.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique key for this request. Reusing it with a changed body returns 409.
      schema: { type: string, minLength: 8, maxLength: 255 }
    DraftRequestId:
      name: X-Request-Id
      in: header
      required: true
      description: Caller-provided UUID echoed as requestId alongside draftId and draftVersion on draft-scoped responses.
      schema: { type: string, format: uuid }
    EventStreamRequestId:
      name: X-Request-Id
      in: header
      required: false
      description: UUID echoed as requestId in every event payload. EventSource clients may instead supply the same UUID in the requestId query parameter; if both are present, they must match.
      schema: { type: string, format: uuid }
    TenantIdHeader:
      name: X-Tenant-Id
      in: header
      required: true
      description: Exact tenant being managed; the Clerk user must be an owner or admin member.
      schema: { type: string, minLength: 1, maxLength: 200 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
  headers:
    RateLimitLimit:
      description: Requests permitted per UTC minute.
      schema: { type: integer }
    RateLimitRemaining:
      description: Requests remaining in the current UTC minute.
      schema: { type: integer }
    RateLimitReset:
      description: Unix timestamp when the current minute resets.
      schema: { type: integer }
    QuotaIncluded:
      description: Comparisons included in the current provider billing period (or calendar month for inactive/bootstrap display).
      schema: { type: integer }
    QuotaUsed:
      description: Successful comparisons used in the current provider billing period (or calendar month for inactive/bootstrap display).
      schema: { type: integer }
    QuotaRemaining:
      description: Comparisons remaining before the prepaid hard cap is reached.
      schema: { type: integer }
  responses:
    BadRequest:
      description: Invalid request
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    Unauthorized:
      description: Missing or invalid authentication
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    Forbidden:
      description: Authentication lacks the required scope or tenant role
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    NotFound:
      description: Resource not found
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    Conflict:
      description: Idempotency key or draft-version conflict
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    RateLimited:
      description: Minute rate limit exceeded
      headers:
        Retry-After: { schema: { type: integer }, description: Seconds until retry }
        RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
        RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
        RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    QuotaExceeded:
      description: Prepaid comparison allowance exhausted
      headers:
        Retry-After: { schema: { type: integer }, description: Seconds until the prepaid allowance resets }
        X-Quota-Included: { $ref: "#/components/headers/QuotaIncluded" }
        X-Quota-Used: { $ref: "#/components/headers/QuotaUsed" }
        X-Quota-Remaining: { $ref: "#/components/headers/QuotaRemaining" }
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    ConfigurationError:
      description: Required server configuration is not available
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    BadGateway:
      description: Comparison analysis or durable finalization failed upstream
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
  schemas:
    ComparisonDraftInterpretInput:
      type: object
      additionalProperties: false
      properties:
        query: { type: string, minLength: 8, maxLength: 4000 }
        market: { type: string, enum: [IN, AU, US, GB] }
        currency: { type: string, enum: [INR, AUD, USD, GBP] }
        idempotencyKey:
          type: string
          format: uuid
          description: Optional stable key for safely repeating the same draft request. A key is generated when omitted.
      required: [query, market, currency]
    ComparisonDraftEnrichmentInput:
      type: object
      additionalProperties: false
      properties:
        draftVersion: { type: integer, minimum: 1 }
      required: [draftVersion]
    ComparisonDraftOptionEditInput:
      type: object
      additionalProperties: false
      description: Save one or more local review edits. Omitted fields remain unchanged, except replacing options clears old URL rows. Options replace the complete option set with 2-6 unique names. Criteria allow at most 8 unique nonblank strings. Market and currency must be supplied together and match. URL rows are syntactically checked only; no network request occurs.
      properties:
        draftVersion: { type: integer, minimum: 1 }
        options:
          type: array
          minItems: 2
          maxItems: 6
          uniqueItems: true
          items:
            type: object
            additionalProperties: false
            properties:
              name: { type: string, minLength: 1, maxLength: 120 }
              entityLevel: { type: string, enum: [PRODUCT, SERVICE, BRAND] }
            required: [name, entityLevel]
        criteria:
          type: array
          maxItems: 8
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 120 }
        market: { type: string, enum: [IN, AU, US, GB] }
        currency: { type: string, enum: [INR, AUD, USD, GBP] }
        urls:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/ComparisonDraftUrlEdit" }
        includeClosingProducts: { type: boolean }
      required: [draftVersion]
      anyOf:
        - required: [options]
        - required: [criteria]
        - required: [market, currency]
        - required: [urls]
        - required: [includeClosingProducts]
    ComparisonDraftUrlEdit:
      type: object
      additionalProperties: false
      properties:
        url: { type: string, minLength: 1, maxLength: 2048, format: uri }
        optionId: { type: string, format: uuid }
      required: [url]
    ComparisonDraftUrl:
      type: object
      properties:
        urlId: { type: string, format: uuid }
        url: { type: string, format: uri }
        requestedUrl: { type: string }
        status: { type: string }
        optionId: { type: string, format: uuid }
      required: [urlId, url, status]
    ComparisonDraftOption:
      type: object
      properties:
        optionId: { type: string, format: uuid }
        originalText: { type: string }
        comparisonValue: { type: string }
        canonicalName: { type: ["string", "null"] }
        resolutionStatus: { type: string, enum: [SUGGESTED] }
        entityLevel: { type: string, enum: [PRODUCT, SERVICE, BRAND] }
        marketVerificationStatus: { type: string, enum: [NOT_ASSESSED] }
        availabilityStatus: { type: string, enum: [NOT_ASSESSED] }
        demographicRelevanceStatus: { type: string, enum: [NOT_ASSESSED] }
        participationStatus: { type: string, enum: [NOT_ASSESSED] }
      required: [optionId, originalText, comparisonValue, canonicalName, resolutionStatus, entityLevel, marketVerificationStatus, availabilityStatus, demographicRelevanceStatus, participationStatus]
    ComparisonDraftWarning:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
      required: [code, message]
    ComparisonDraftOptionDiscovery:
      type: object
      description: Concrete shortlist discovery is a proposed interpretation, not proof of market availability. Provider/model provenance describes AI-generated labels only, with no source verification. Successful newly interpreted drafts contain concrete options for confirmation.
      properties:
        status: { type: string, enum: [REQUIRED, PROPOSED] }
        anchorOptionId: { type: string, format: uuid }
        entityLevel: { type: string, enum: [PRODUCT, SERVICE, BRAND] }
        targetCount: { type: integer, minimum: 2, maximum: 6 }
        objectives:
          type: array
          items: { type: string }
        provenance:
          type: object
          properties:
            provider: { type: string }
            model: { type: string }
          required: [provider, model]
      required: [status, anchorOptionId, entityLevel, targetCount, objectives]
    ComparisonDraft:
      type: object
      properties:
        draftId: { type: string, format: uuid }
        draftVersion: { type: integer }
        requestId: { type: string, format: uuid }
        idempotencyKey:
          type: string
          format: uuid
          description: Server-provided value to retain when repeating this exact draft submission.
        version: { type: integer }
        status: { type: string, enum: [READY_FOR_REVIEW, READY_FOR_REVIEW_WITH_FALLBACK] }
        originalQuery: { type: string }
        rawUserQuery:
          type: string
          description: Original user input retained for audit. originalQuery is the deterministic corrected, persisted confirmation and scoring contract.
        options:
          type: array
          items: { $ref: "#/components/schemas/ComparisonDraftOption" }
        optionDiscovery:
          $ref: "#/components/schemas/ComparisonDraftOptionDiscovery"
        comparisonLevel: { type: string, enum: [PRODUCT, SERVICE, BRAND, MIXED] }
        decisionObjective: { type: string }
        decisionDomain: { type: string }
        category: { type: string }
        market:
          type: object
          properties:
            country: { type: string }
            currency: { type: string }
          required: [country, currency]
        criteria:
          type: array
          items: { type: string }
        includeClosingProducts: { type: boolean }
        enrichmentStatus: { type: string, enum: [NOT_STARTED, QUEUED, COMPLETE, PARTIAL, FAILED] }
        marketSuggestions:
          type: object
          additionalProperties: true
        urls:
          type: array
          items: { $ref: "#/components/schemas/ComparisonDraftUrl" }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/ComparisonDraftWarning" }
      required: [draftId, draftVersion, requestId, version, status, originalQuery, options, comparisonLevel, decisionObjective, decisionDomain, category, market, criteria, enrichmentStatus]
    ComparisonDraftSuggestion:
      type: object
      properties:
        canonicalEntityId: { type: string }
        displayName: { type: string }
        entityLevel: { type: string, enum: [PRODUCT, SERVICE, BRAND, PROVIDER, MIXED] }
        category: { type: string }
        parentBrand: { type: ["string", "null"] }
        contextFit: { type: number }
        marketRelevance: { type: string, enum: [HIGH, MODERATE, LOW, NOT_ASSESSED] }
        availabilityMode: { type: string }
        reason: { type: string }
        selected: { type: boolean }
        marketVerificationStatus: { type: string, enum: [NOT_ASSESSED] }
      required: [canonicalEntityId, displayName, entityLevel, category, parentBrand, contextFit, marketRelevance, availabilityMode, reason, selected, marketVerificationStatus]
    ComparisonDraftSuggestions:
      type: object
      description: Suggestions echo draftId, draftVersion, requestId, and the requested optionId.
      properties:
        draftId: { type: string, format: uuid }
        draftVersion: { type: integer }
        requestId: { type: string, format: uuid }
        optionId: { type: string, format: uuid }
        suggestions:
          type: array
          items: { $ref: "#/components/schemas/ComparisonDraftSuggestion" }
        status: { type: string, enum: [SUGGESTED_NOT_VERIFIED] }
        message: { type: string }
      required: [draftId, draftVersion, requestId, optionId, suggestions, status, message]
    ComparisonDraftEnrichmentJob:
      type: object
      description: Correlation tuple identifies the draft version and caller request that queued this asynchronous operation.
      properties:
        jobId: { type: string, format: uuid }
        draftId: { type: string, format: uuid }
        draftVersion: { type: integer }
        requestId: { type: string, format: uuid }
        status: { type: string, enum: [queued] }
        pollUrl: { type: string }
      required: [jobId, draftId, draftVersion, requestId, status, pollUrl]
    ComparisonDraftEnrichmentJobStatus:
      type: object
      description: Echoes the current polling request's requestId with the current draftId and draftVersion.
      properties:
        jobId: { type: string, format: uuid }
        draftId: { type: string, format: uuid }
        draftVersion: { type: integer }
        requestId: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, complete, partial, failed, stale] }
        result:
          type: object
          additionalProperties: true
        error: { type: string }
        message: { type: string }
      required: [jobId, draftId, draftVersion, requestId, status]
    ComparisonDraftUrlValidationInput:
      type: object
      additionalProperties: false
      properties:
        url: { type: string, format: uri, maxLength: 2048 }
        optionId: { type: string, format: uuid }
        draftVersion: { type: integer, minimum: 1 }
      required: [url, optionId, draftVersion]
    ComparisonDraftUrlValidation:
      type: object
      description: Echoes draftId, draftVersion, requestId, the checked URL, and its required optionId. requestedUrl retains the supplied URL; url is the validated URL.
      properties:
        draftId: { type: string, format: uuid }
        draftVersion: { type: integer }
        requestId: { type: string, format: uuid }
        urlId: { type: string, format: uuid }
        url: { type: string, format: uri }
        optionId: { type: string, format: uuid }
        requestedUrl: { type: string, format: uri }
        state: { type: string, enum: [accepted, inaccessible, stale, wrong_market, unrelated] }
        reason: { type: string }
        replacementUrl: { type: string, format: uri }
        version: { type: integer }
      required: [draftId, draftVersion, requestId, urlId, url, optionId, requestedUrl, state, reason, version]
    DraftRequestCorrelation:
      type: object
      description: Correlation tuple returned with draft-scoped operation responses.
      properties:
        draftId: { type: string, format: uuid }
        draftVersion: { type: integer, minimum: 1 }
        requestId: { type: string, format: uuid }
      required: [draftId, draftVersion, requestId]
    ComparisonDraftError:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        errors:
          type: array
          description: Field-specific request validation details. Unknown fields are reported separately from value validation.
          items:
            type: object
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }
            required: [field, code, message]
      required: [code, message]
    LegacyErrorResponse:
      type: object
      properties:
        error: { type: string }
      required: [error]
    ErrorResponse:
      type: object
      description: Stable structured error envelope; error is retained for legacy clients.
      properties:
        code: { type: string, example: invalid_request }
        message: { type: string }
        requestId: { type: string }
        details: { type: object, additionalProperties: true }
      required: [code, message]
    Tenant:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        plan: { type: string }
        billingStatus: { type: string, enum: [inactive, active, past_due] }
        includedComparisons: { type: integer }
        requestsPerMinute: { type: integer }
      required: [id, name, plan, billingStatus, includedComparisons, requestsPerMinute]
    AuditEvent:
      type: object
      properties:
        id: { type: integer }
        actorId: { type: string }
        action: { type: string }
        metadata: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
      required: [id, actorId, action, metadata, createdAt]
    ApiKeyCreateInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        scopes:
          type: array
          items: { type: string, enum: [comparisons:read, comparisons:write, usage:read] }
        expiresAt: { type: string, format: date-time }
      required: [name]
    ApiKeyMetadata:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        prefix: { type: string }
        scopes: { type: array, items: { type: string } }
        expiresAt: { type: string, format: date-time, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }
        lastUsedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
      required: [id, name, prefix, scopes, createdAt]
    ApiKeyCreated:
      allOf:
        - $ref: "#/components/schemas/ApiKeyMetadata"
        - type: object
          properties:
            key: { type: string, description: Plaintext key; returned only once. }
          required: [key]
    UsageSummary:
      type: object
      properties:
        month: { type: string, example: "2025-01-15/2025-02-15", description: Provider period label; inactive/bootstrap tenants use YYYY-MM. }
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        included: { type: integer }
        used: { type: integer }
        remaining: { type: integer, description: Comparisons remaining before the prepaid hard cap is reached. }
        exhausted: { type: boolean }
      required: [month, periodStart, periodEnd, included, used, remaining, exhausted]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ComparisonReview:
      type: object
      properties:
        draftId: { type: string, format: uuid }
        draftVersion: { type: integer }
        requestId: { type: string, format: uuid }
        comparisonType: { type: string }
        decisionDomain: { type: string }
        category: { type: string }
        customerLocation: { type: ["string", "null"] }
        criteria:
          type: array
          items: { type: string }
        comparisonValues:
          type: array
          items: { $ref: "#/components/schemas/ConfirmedComparisonValue" }
        comparisonLevel:
          $ref: "#/components/schemas/ComparisonLevel"
      required: [draftId, draftVersion, requestId, comparisonType, decisionDomain, category, customerLocation, criteria, comparisonValues]
    ComparisonInput:
      type: object
      description: Comparison research must use a persisted draft after user confirmation. The draft identifier and observed version bind the confirmed values and explicit market to the handoff; interpretation output alone is not a valid submission.
      properties:
        draftId:
          type: string
          format: uuid
          description: Required persisted review draft whose options the user confirmed.
        draftVersion:
          type: integer
          minimum: 1
          description: Required draft version observed at confirmation; later enrichment-only versions may be compatible.
        prompt:
          type: string
          minLength: 8
          maxLength: 2000
        market:
          type: string
          description: Required user-selected research market. MVP coverage is limited to India, Australia, the United States, and the United Kingdom so local evidence can be validated reliably; it takes precedence over location cues inferred from the prompt.
          enum: [IN, AU, US, GB]
        validatedComparisonType:
          type: string
          maxLength: 80
          description: User-confirmed comparison type. Revalidated against identified options; supersedes the parsed type.
        comparisonLevel:
          $ref: "#/components/schemas/ComparisonLevel"
        comparisonValues:
          type: array
          minItems: 2
          maxItems: 6
          description: Confirmed option values. rawText is retained verbatim and confirmedName remains authoritative downstream.
          items:
            $ref: "#/components/schemas/ConfirmedComparisonValue"
        demographicContext:
          $ref: "#/components/schemas/DemographicContext"
        sourceAssociations:
          type: array
          maxItems: 12
          description: Optional URL-to-confirmed-option links. A URL never resolves or changes comparison identity.
          items: { $ref: "#/components/schemas/ComparisonSourceAssociation" }
        validatedDecisionDomain:
          type: string
          maxLength: 100
          description: User-confirmed decision domain, checked against the option identities and selected type.
        validatedCategory:
          type: string
          maxLength: 100
          description: User-confirmed category, checked against the option identities and selected type.
        customerSegment:
          type: string
          maxLength: 100
          description: Optional buyer/customer segment to apply to this decision.
        customerLocation:
          type: string
          maxLength: 120
          description: Customer origin city or postcode for a dealer decision; never a dealer address.
        crossMarketConfirmed:
          type: boolean
          description: Explicit user confirmation that options with known different primary markets are intentionally being compared across countries.
        includeClosingProducts:
          type: boolean
          default: false
          description: Include products with verified CLOSING status in scoring; the report will retain a closing warning. Defaults to false.
        annualDistanceKm:
          type: integer
          minimum: 1
          maximum: 500000
          description: Optional annual driving distance used only for a transparent Battery-as-a-Service scenario total when ownershipPeriodYears is also supplied.
        ownershipPeriodYears:
          type: number
          minimum: 0.5
          maximum: 30
          multipleOf: 0.5
          description: Optional ownership period used only for a transparent Battery-as-a-Service scenario total when annualDistanceKm is also supplied.
        vendors:
          type: array
          minItems: 2
          maxItems: 6
          items:
            type: string
            minLength: 1
            maxLength: 120
        urls:
          type: array
          items:
            type: string
            format: uri
        criteria:
          type: array
          maxItems: 8
          items:
            type: string
            minLength: 1
            maxLength: 100
      required: [draftId, draftVersion, prompt, market, comparisonValues]
    ComparisonLevel:
      type: string
      description: Generic comparison granularity, independent of the dynamically inferred category.
      enum: [PRODUCT, SERVICE, BRAND, PROVIDER, MIXED]
    ConfirmedComparisonValue:
      type: object
      properties:
        rawText:
          type: string
          minLength: 1
          maxLength: 120
          description: Original extracted wording, preserved verbatim.
        confirmedName:
          type: string
          minLength: 1
          maxLength: 120
          description: User-confirmed option name; research must not silently replace it.
        canonicalEntityId:
          type: string
          maxLength: 160
          description: Optional identity selected by the user from contextual suggestions.
        entityLevel:
          $ref: "#/components/schemas/ComparisonLevel"
      required: [rawText, confirmedName]
    DemographicContext:
      type: object
      description: Optional decision-specific market and customer context. Omit attributes not relevant to the decision.
      properties:
        country: { type: string, maxLength: 120 }
        region: { type: string, maxLength: 120 }
        stateOrRegion: { type: string, maxLength: 120 }
        city: { type: string, maxLength: 120 }
        postcode: { type: string, maxLength: 120 }
        customerSegment: { type: string, maxLength: 120 }
        ageGroup: { type: string, maxLength: 120 }
        businessOrConsumer:
          type: string
          enum: [CONSUMER, SMALL_BUSINESS, ENTERPRISE]
        useCase: { type: string, maxLength: 120 }
        deliveryNeed:
          type: string
          enum: [LOCAL_STORE, LOCAL_ONLINE, CROSS_BORDER, DIGITAL]
        currency: { type: string, maxLength: 120 }
        language: { type: string, maxLength: 120 }
        regulatoryContext:
          type: array
          maxItems: 12
          items: { type: string, maxLength: 120 }
      required: [country]
    ComparisonSourceAssociation:
      type: object
      properties:
        url: { type: string, format: uri }
        option:
          type: string
          minLength: 1
          maxLength: 120
          description: Must exactly match one confirmed comparison value name.
      required: [url, option]
    ComparisonSuggestInput:
      type: object
      properties:
        typedText: { type: string, minLength: 2, maxLength: 120 }
        fullQuery: { type: string, maxLength: 2000 }
        otherOptions:
          type: array
          maxItems: 6
          items: { type: string, maxLength: 120 }
        decisionObjective: { type: string, maxLength: 500 }
        market:
          description: User-selected market context. Market relevance is NOT_ASSESSED unless verified evidence is available.
          oneOf:
            - type: string
              enum: [IN, AU, US, GB]
            - type: object
              properties:
                country: { type: string, maxLength: 120 }
                stateOrRegion: { type: string, maxLength: 120 }
                city: { type: string, maxLength: 120 }
                postcode: { type: string, maxLength: 120 }
        customerContext:
          $ref: "#/components/schemas/DemographicContext"
      required: [typedText, fullQuery, otherOptions, decisionObjective]
    ComparisonSuggestion:
      type: object
      properties:
        canonicalEntityId: { type: string }
        displayName: { type: string }
        entityLevel: { $ref: "#/components/schemas/ComparisonLevel" }
        category: { type: string }
        parentBrand: { type: ["string", "null"] }
        contextFit: { type: number, minimum: 0, maximum: 1 }
        marketRelevance:
          type: string
          enum: [HIGH, MODERATE, LOW, NOT_ASSESSED]
        availabilityMode: { type: string }
        reason: { type: string }
      required: [canonicalEntityId, displayName, entityLevel, category, parentBrand, contextFit, marketRelevance, availabilityMode, reason]
    ComparisonSuggestResponse:
      type: object
      properties:
        suggestions:
          type: array
          items: { $ref: "#/components/schemas/ComparisonSuggestion" }
      required: [suggestions]
    RegenerateComparisonInput:
      type: object
      properties:
        suppliedUrls:
          type: array
          maxItems: 12
          description: Optional replacement list of user-supplied research URLs. Omitting it preserves the existing list. Changing the list does not rerun research.
          items:
            type: string
            format: uri
        weights:
          type: array
          minItems: 9
          maxItems: 10
          items:
            $ref: "#/components/schemas/ComparisonWeight"
        additionalWeights:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/AdditionalComparisonWeight"
      required: [weights]
    ComparisonWeight:
      type: object
      properties:
        criterionId:
          type: string
          description: Stable built-in criterion identifier. Optional only for older clients.
        criterion:
          type: string
        weight:
          type: integer
          minimum: 0
          maximum: 100
      required: [criterion, weight]
    AdditionalComparisonWeight:
      type: object
      properties:
        criterionId:
          type: string
          description: Stable generated custom criterion identifier. Optional only for older clients.
        criterion:
          type: string
          minLength: 1
          maxLength: 100
        weight:
          type: integer
          minimum: 0
          maximum: 100
        mappedCriteria:
          type: array
          minItems: 1
          maxItems: 2
          items:
            type: string
        overlapResolution:
          type: string
          enum: [KEEP_SEPARATE]
          description: Explicit acknowledgement that a related built-in factor measures something distinct.
        overlapReason:
          type: string
          description: User's distinction between the custom and overlapping built-in factors.
      required: [criterion, weight, mappedCriteria]
    ComparisonWeightModel:
      type: object
      description: Validated authoritative raw user allocations. Normalized lens weights are derived for ranking only.
      properties:
        version: { type: integer, enum: [1] }
        criteria:
          type: array
          items:
            type: object
            properties:
              criterionId: { type: string }
              criterionLabel: { type: string }
              criterionType: { type: string, enum: [BUILT_IN, CUSTOM] }
              weight: { type: integer, minimum: 0, maximum: 100 }
              mappedLensId: { type: string }
              mappingConfidence: { type: number, minimum: 0, maximum: 1 }
              validationStatus: { type: string, enum: [VALIDATED] }
              overlapResolution: { type: string, enum: [KEEP_SEPARATE] }
              overlapReason: { type: string }
            required: [criterionId, criterionLabel, criterionType, weight, mappedLensId, mappingConfidence, validationStatus]
        totalWeight: { type: integer, minimum: 1, maximum: 100 }
        unallocatedWeight: { type: integer, minimum: 0, maximum: 99 }
      required: [version, criteria, totalWeight, unallocatedWeight]
    ComparisonPromptInput:
      type: object
      properties:
        prompt:
          type: string
          minLength: 8
          maxLength: 2000
        market:
          type: string
          enum: [IN, AU, US, GB]
      required: [prompt]
    SourcePreflightInput:
      type: object
      properties:
        draftId: { type: string, format: uuid }
        draftVersion: { type: integer, minimum: 1 }
        prompt:
          type: string
          minLength: 8
          maxLength: 4000
        market:
          type: string
          enum: [IN, AU, US, GB]
          description: Explicit selected market bound to the confirmed draft.
        comparisonValues:
          type: array
          minItems: 2
          maxItems: 6
          items: { $ref: "#/components/schemas/ConfirmedComparisonValue" }
        urls:
          type: array
          minItems: 1
          maxItems: 12
          items:
            type: string
            format: uri
        vendors:
          type: array
          minItems: 2
          maxItems: 6
          description: Optional user-confirmed option names for URL relevance checks only; source URLs never define identity.
          items: { type: string, minLength: 1, maxLength: 120 }
      required: [draftId, draftVersion, prompt, market, comparisonValues, urls]
    SourcePreflightResult:
      type: object
      properties:
        url:
          type: string
          format: uri
        state:
          type: string
          enum: [accepted, inaccessible, stale, wrong_market, unrelated]
        reason:
          type: string
        replacementUrl:
          type: string
          format: uri
      required: [url, state, reason]
    SourcePreflightResponse:
      type: object
      properties:
        draftId: { type: string, format: uuid }
        draftVersion: { type: integer }
        requestId: { type: string, format: uuid }
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SourcePreflightResult"
      required: [draftId, draftVersion, requestId, sources]
    ParsedComparison:
      type: object
      description: |
        One-shot parse result. Entity boundaries are resolved before source retrieval.
        The response preserves user order and exposes the qualifiers, decision criterion,
        and freshness requirements that downstream research must honor. Incomplete
        requests return context.valid=false with a clarification, not a server error.
      properties:
        prompt:
          type: string
        comparisonLevel:
          $ref: "#/components/schemas/ComparisonLevel"
        comparisonValues:
          type: array
          items: { $ref: "#/components/schemas/ConfirmedComparisonValue" }
        vendors:
          type: array
          minItems: 0
          maxItems: 6
          items:
            type: string
        urls:
          type: array
          items:
            type: string
        criteria:
          type: array
          items:
            type: string
        context:
          $ref: "#/components/schemas/ComparisonContext"
        intent:
          $ref: "#/components/schemas/ComparisonIntent"
        comparisonIdentity:
          $ref: "#/components/schemas/ComparisonIdentity"
      required: [prompt, vendors, urls, criteria, context, intent, comparisonIdentity]
    ComparisonOptionClassification:
      type: object
      properties:
        name:
          type: string
        originalText:
          type: string
          description: Exact submitted option, never replaced by a research-generated label.
        canonicalEntityId:
          type: string
        canonicalName:
          type: string
        entityType:
          type: string
        brand:
          type: string
        productCategory:
          type: string
        classificationConfidence:
          type: number
          minimum: 0
          maximum: 1
        resolutionStatus:
          type: string
          enum: [RESOLVED, AMBIGUOUS, CONFLICTING, UNRESOLVED, USER_CONFIRMED]
        alternativeCandidates:
          type: array
          items:
            type: string
        type:
          type: string
          enum: [brand, product, service, platform, dealer, bank, curriculum, vehicle, hotel, healthcare_provider, education, unknown]
        decisionDomain:
          type: string
        customerSegment:
          type: string
          description: Canonical decision domain when the option is recognized.
        subcategory:
          type: string
          description: Product subtype shown for context but not required to match within one decision domain.
        primaryMarket:
          type: string
          enum: [IN, AU, US, GB]
          description: Known primary country code. Omitted when the option's footprint is not established.
      required: [name, type]
    ComparisonJobAccepted:
      type: object
      description: Accepted asynchronous comparison job. A preliminary scored choice is published before bounded targeted research continues; the hard deadline is 20 seconds.
      properties:
        draftId: { type: string, format: uuid }
        draftVersion: { type: integer }
        requestId: { type: string, format: uuid }
        jobId:
          type: string
          format: uuid
        status:
          type: string
          enum: [processing]
        stage:
          $ref: "#/components/schemas/ComparisonJobStage"
        progress:
          $ref: "#/components/schemas/ComparisonJobProgress"
        previewDecision:
          $ref: "#/components/schemas/ComparisonPreviewDecision"
        targetCompletionSeconds:
          type: integer
          minimum: 1
          example: 20
          description: Hard deadline in seconds for reaching a complete, partial, or failed terminal job state.
      required: [draftId, draftVersion, requestId, jobId, status, stage, progress, targetCompletionSeconds]
    ComparisonJobStage:
      type: string
      enum: [finding_official_sources, building_evidence, analysing_evidence, verifying_market, validating_market_eligibility, validating_comparison, preparing_result, completed, partial_result]
    ComparisonJobProgress:
      type: object
      properties:
        entities:
          type: array
          items: { type: string }
          minItems: 2
          maxItems: 6
        subject:
          type: string
      required: [entities, subject]
    ComparisonPreviewDecision:
      type: object
      description: An early assumption-led starting choice, not a verified finding. Research continues after this is returned.
      properties:
        winner: { type: string }
        decisionType:
          type: string
          enum: [Product Selection, Service Selection, Vendor Evaluation, Dealership Investment, Franchise Opportunity, Market Entry, Technology Platform Selection]
        coverage: { type: integer, minimum: 0, maximum: 100 }
        reason: { type: string }
        provisional: { type: boolean }
        priorities:
          type: array
          items:
            type: object
            properties:
              lens: { type: string }
              weight: { type: integer, minimum: 0, maximum: 100 }
            required: [lens, weight]
      required: [winner, decisionType, coverage, reason, provisional, priorities]
    RetryableComparisonJob:
      type: object
      properties:
        jobId: { type: string, format: uuid }
        failedAt: { type: string, format: date-time }
        request:
          $ref: "#/components/schemas/ComparisonInput"
      required: [jobId, failedAt, request]
    RetryableComparisonJobs:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RetryableComparisonJob"
      required: [items]
    ComparisonJobState:
      type: object
      description: Pollable state for asynchronous comparison research. Partial results contain the preliminary comparison when targeted research fails or reaches the 20-second hard deadline.
      properties:
        draftId: { type: string, format: uuid }
        draftVersion: { type: integer }
        requestId: { type: string, format: uuid }
        status:
          type: string
          enum: [processing, complete, partial, failed]
        stage:
          $ref: "#/components/schemas/ComparisonJobStage"
        progress:
          $ref: "#/components/schemas/ComparisonJobProgress"
        elapsedMs:
          type: integer
          minimum: 0
          description: Server-measured milliseconds from job creation to the terminal timestamp; frozen after completion or failure.
        targetCompletionSeconds:
          type: integer
          minimum: 1
          example: 20
          description: Hard deadline in seconds for reaching a terminal job state.
        result:
          description: Completed comparison payload. Required when status is partial; in that case this is the preserved preliminary comparison. For authenticated partial jobs, an id is added only after persistence succeeds.
          oneOf:
            - $ref: "#/components/schemas/Comparison"
            - $ref: "#/components/schemas/GuestComparison"
        saveStatus:
          type: string
          enum: [pending, saved, failed]
          description: Authenticated job persistence state. Present as pending on partial publication, saved only after a persisted result ID is available, or failed if persistence rejects. Omitted for guest jobs.
        previewDecision:
          $ref: "#/components/schemas/ComparisonPreviewDecision"
        message:
          type: string
          description: User-safe completion, partial-result, or recovery guidance. Partial states explain targeted-research failure or the 20-second deadline while preserving the preliminary report.
        errorCode:
          type: string
          description: Stable terminal error or partial-result category. A partial result remains usable and includes its preliminary report.
          enum: [research_failed, validation_failed, insufficient_quantitative_evidence, latency_budget_exceeded]
      required: [draftId, draftVersion, requestId, status, stage, progress, elapsedMs, targetCompletionSeconds]
    ComparisonIdentity:
      type: object
      description: Canonical comparison set used by every downstream label and recommendation.
      properties:
        originalQuery: { type: string }
        category: { type: string }
        entities:
          type: array
          minItems: 0
          maxItems: 6
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
            required: [id, name]
        entityCount: { type: integer, minimum: 0, maximum: 6 }
        comparisonType:
          type: string
          enum: [pair, multi_entity]
        displayName: { type: string }
        headline: { type: string }
      required: [originalQuery, category, entities, entityCount, comparisonType, displayName, headline]
    ComparisonIntent:
      type: object
      properties:
        options:
          type: array
          maxItems: 6
          items:
            type: string
        subject:
          type: string
        decisionType:
          type: string
          enum: [comparison, choice, purchase_channel, financing, migration]
        category:
          type: string
        useCase:
          type: string
        qualifiers:
          type: array
          description: Explicit constraints such as market, budget, time period, purpose, or version.
          maxItems: 8
          items:
            type: string
        decisionCriterion:
          type: string
          description: The outcome against which the final recommendation must be judged.
        freshness:
          type: string
          description: Whether research requires current, historical, or generally stable evidence.
          enum: [current, historical, stable]
        confidence:
          type: number
          minimum: 0
          maximum: 1
        clarification:
          type: string
      required: [options, subject, decisionType, category, useCase, qualifiers, decisionCriterion, freshness, confidence, clarification]
    ComparisonContext:
      type: object
      properties:
        valid:
          type: boolean
        segment:
          type: string
        industry:
          type: string
        message:
          type: string
        comparisonType:
          type: string
          description: Deterministic comparison category derived from identified options, such as Vehicle Comparison or Curriculum Comparison.
        decisionDomain:
          type: string
          description: Shared recognized decision domain for the compared options.
        optionClassifications:
          type: array
          items:
            $ref: "#/components/schemas/ComparisonOptionClassification"
        crossMarket:
          type: boolean
          description: True only when a known primary market differs between options or from the selected market.
        market:
          type: string
          enum: [IN, AU, US, GB]
          description: Validated or inferred customer market code when known.
        country:
          type: string
          description: Human-readable validated or inferred country when known.
        customerLocation:
          type: string
          description: Explicit customer city, state, or postcode when known.
      required: [valid, segment, industry, message]
    ComparisonSummary:
      type: object
      properties:
        provenanceGapCount:
          type: integer
          minimum: 0
          description: Number of cited scorecard claims without complete document provenance; a review does not change the original citations.
        id:
          type: integer
        prompt:
          type: string
        vendors:
          type: array
          maxItems: 6
          items:
            type: string
        comparisonIdentity:
          $ref: "#/components/schemas/ComparisonIdentity"
        category:
          type: string
        recommendation:
          type: string
        score:
          type: integer
        baseScore:
          type: integer
          description: Weighted score before the strategic provider-role tie-break.
        providerRoleTieBreakBonus:
          type: integer
          minimum: 0
          maximum: 2
          description: Two-point bonus applied only to the unique highest-precedence provider role in a top-score tie.
        createdAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [complete, processing, failed]
        researchStatus:
          type: string
          enum: [partial, complete]
          description: Persisted targeted-research completion marker. Partial reports retain the preliminary scorecard when follow-up research failed or timed out.
      required: [id, prompt, vendors, comparisonIdentity, category, recommendation, score, createdAt, status]
    ComparisonEvidenceReview:
      type: object
      required: [jobId, status, startedAt, initialRecommendation, checks]
      properties:
        jobId: { type: string, format: uuid }
        status: { type: string, enum: [processing, complete, failed] }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        initialRecommendation: { type: string }
        reviewedRecommendation: { type: string }
        reviewReason: { type: string }
        error: { type: string }
        checks:
          type: array
          items:
            type: object
            required: [vendor, claim, sourceUrl, status, reason]
            properties:
              vendor: { type: string }
              claim: { type: string }
              criterion: { type: string }
              sourceUrl: { type: string }
              status: { type: string, enum: [verified, contradicted, unavailable] }
              quote: { type: string }
              reason: { type: string }
              checkedAt: { type: string, format: date-time }
              sourceId: { type: string }
              documentSha256: { type: string }
              sourceTextStart: { type: integer }
              sourceTextEnd: { type: integer }
              retrievedAt: { type: string, format: date-time }
              accessStatus: { type: string, enum: [ALLOWED, LICENSED, CUSTOMER_SUPPLIED] }
              permissionCheckedAt: { type: string, format: date-time }
        verificationScore:
          type: ["number", "null"]
          description: Percentage of completed, available checks that were verified; null when no such checks are available.
        evidenceCoverage:
          type: ["number", "null"]
          description: Percentage of checks with a conclusive verified or contradicted result; null when no checks are available.
        assumptionRegister:
          type: array
          items:
            type: object
            required: [assumption, status, reason, sourceUrls]
            properties:
              assumption: { type: string }
              status: { type: string, enum: [unverified, validated, contradicted] }
              reason: { type: string }
              sourceUrls:
                type: array
                items: { type: string }
        sourceRegister:
          type: array
          items:
            type: object
            required: [url, availability, freshness, lastCheckedAt, checkCount, verifiedCount, contradictedCount, unavailableCount]
            properties:
              url: { type: string }
              availability: { type: string, enum: [admitted, restricted, unavailable] }
              freshness: { type: string, enum: [known, unknown] }
              publicationDate: { type: string }
              ageDays: { type: integer }
              lastCheckedAt: { type: string, format: date-time }
              checkCount: { type: integer }
              verifiedCount: { type: integer }
              contradictedCount: { type: integer }
              unavailableCount: { type: integer }
        competitiveValidation:
          type: object
          required: [status, recommendation, checkedCompetitors, summary]
          properties:
            status: { type: string, enum: [not_assessed, partial, contradiction_found] }
            recommendation: { type: string }
            checkedCompetitors:
              type: array
              items: { type: string }
            summary: { type: string }
        riskAssessment:
          type: object
          required: [level, items, summary]
          properties:
            level: { type: string, enum: [unknown, low, medium, high] }
            items:
              type: array
              items: { type: string }
            summary: { type: string }
        validationReport: { type: string }
        governanceReport: { type: string }
        auditTrail:
          type: array
          items:
            type: object
            required: [timestamp, event, detail]
            properties:
              timestamp: { type: string, format: date-time }
              event: { type: string }
              detail: { type: string }
    ComparisonVerificationAccess:
      type: object
      required: [access]
      properties:
        access: { type: string, enum: [active, payment_required, not_configured] }
        message: { type: string }
    ComparisonVerificationCheckout:
      type: object
      required: [purchaseUrl]
      properties:
        purchaseUrl: { type: string, format: uri }
    ValidatedComparisonContext:
      type: object
      description: Context checked before research. Unknown buyer facts are null; product availability is not presented as verified before research.
      required: [decisionType, country, state, customerLocation, currency, productAvailability, industry, organisationSize, dataResidency, market, marketContext]
      properties:
        validatedUserPrompt:
          type: string
          description: Exact user-supplied prompt after validation; remains authoritative even if processing prompts add internal guidance.
        comparisonType:
          type: string
        decisionDomain:
          type: string
        customerSegment:
          type: string
        optionClassifications:
          type: array
          items:
            $ref: "#/components/schemas/ComparisonOptionClassification"
        crossMarket:
          type: boolean
        comparisonLevel:
          $ref: "#/components/schemas/ComparisonLevel"
        comparisonValues:
          type: array
          items: { $ref: "#/components/schemas/ConfirmedComparisonValue" }
        demographicContext:
          $ref: "#/components/schemas/DemographicContext"
        sourceAssociations:
          type: array
          description: Validated option ownership with preflight outcome; rejected sources do not affect option eligibility.
          items:
            type: object
            properties:
              url: { type: string, format: uri }
              option: { type: string }
              preflightState:
                type: string
                enum: [accepted, inaccessible, stale, wrong_market, unrelated, NOT_CHECKED]
              preflightReason: { type: string }
            required: [url, option, preflightState]
        sourcePreflightResults:
          type: array
          description: URL-only preflight results. Rejected optional URLs are not evidence that their associated option is unavailable.
          items:
            type: object
            properties:
              url: { type: string, format: uri }
              state:
                type: string
                enum: [accepted, inaccessible, stale, wrong_market, unrelated]
              reason: { type: string }
              replacementUrl: { type: string, format: uri }
            required: [url, state, reason]
        decisionType: { type: string }
        country: { type: string }
        state: { type: ["string", "null"] }
        customerLocation: { type: ["string", "null"] }
        currency: { type: string }
        productAvailability: { type: string }
        industry: { type: ["string", "null"] }
        organisationSize: { type: ["string", "null"] }
        dataResidency: { type: ["string", "null"] }
        market: { type: string }
        marketContext: { type: string }
    Comparison:
      allOf:
        - $ref: "#/components/schemas/ComparisonSummary"
        - type: object
          properties:
            urls:
              type: array
              items:
                type: string
            suppliedUrls:
              type: array
              description: URLs explicitly supplied by the user, separate from discovered evidence sources.
              items:
                type: string
            sourceAvailability:
              type: array
              description: Availability information for every source checked while producing the report. Legacy reports may return reachable entries derived from urls.
              items:
                $ref: "#/components/schemas/ReportSource"
            decisionStatus:
              type: string
              enum: [ELIGIBLE, CONDITIONALLY_ELIGIBLE, INELIGIBLE, CLARIFICATION_REQUIRED]
              description: Participation status for the selected recommendation in its validated market and demographic context.
            marketRelevance:
              type: array
              description: Per-option demographic and geographic relevance assessments.
              items: { $ref: "#/components/schemas/MarketRelevanceAssessment" }
            criteria:
              type: array
              items:
                type: string
            executiveSummary:
              type: string
            recommendationReason:
              type: string
            decisionAdvice:
              $ref: "#/components/schemas/DecisionAdvice"
            evidenceReview:
              $ref: "#/components/schemas/ComparisonEvidenceReview"
            confirmedRecommendation:
              $ref: "#/components/schemas/ConfirmedRecommendation"
            alternatives:
              type: array
              description: Ranked alternatives drawn only from the original compared option set, excluding the confirmed recommendation.
              items:
                $ref: "#/components/schemas/ComparedAlternative"
            weightAdjustments:
              type: array
              maxItems: 8
              items:
                $ref: "#/components/schemas/AdditionalComparisonWeight"
            weightModel:
              oneOf:
                - $ref: "#/components/schemas/ComparisonWeightModel"
                - type: "null"
            vendorScores:
              type: array
              items:
                $ref: "#/components/schemas/VendorScore"
            pricing:
              type: array
              items:
                $ref: "#/components/schemas/AnalysisRow"
            features:
              type: array
              items:
                $ref: "#/components/schemas/AnalysisRow"
            swot:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
            opportunities:
              type: array
              items:
                type: string
            insights:
              type: array
              items:
                type: string
            nextSteps:
              type: array
              items:
                type: string
            contextAssumptions:
              type: array
              description: Explicit assumptions made where business, regulatory, security, commercial, operating, integration, data, or maturity context was missing.
              items: { type: string }
            validatedContext:
              $ref: "#/components/schemas/ValidatedComparisonContext"
            productEquivalency:
              type: array
              description: Like-for-like mapping of current and target products or services, including partial equivalence and uncovered scope.
              items: { $ref: "#/components/schemas/ProductEquivalencyItem" }
            functionalGaps:
              type: array
              description: Required capabilities that are absent, partial, changed, or unverified in the target arrangement.
              items: { $ref: "#/components/schemas/FunctionalGapItem" }
            serviceProductMap:
              type: array
              description: Mapping between business services and the products, dependencies, and owners that enable them.
              items: { $ref: "#/components/schemas/ServiceProductMapItem" }
            migrationSequence:
              type: array
              description: Ordered migration phases with dependencies, exit criteria, and risk.
              items: { $ref: "#/components/schemas/MigrationPhase" }
            decisionGovernance:
              type: array
              description: Decision rights, evidence requirements, approvers, and approval gates.
              items: { $ref: "#/components/schemas/DecisionGovernanceItem" }
          required: [urls, sourceAvailability, criteria, executiveSummary, recommendationReason, confirmedRecommendation, alternatives, vendorScores, pricing, features, swot, opportunities, insights, nextSteps, contextAssumptions, productEquivalency, functionalGaps, serviceProductMap, migrationSequence, decisionGovernance]
