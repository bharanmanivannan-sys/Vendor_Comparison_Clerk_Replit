      operationId: externalListComparisons
      tags: [commercial]
      summary: List tenant comparisons
      description: Requires an API key with the comparisons:read scope.
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Tenant comparisons
          headers:
            RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
            RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
            X-Quota-Included: { $ref: "#/components/headers/QuotaIncluded" }
            X-Quota-Used: { $ref: "#/components/headers/QuotaUsed" }
            X-Quota-Remaining: { $ref: "#/components/headers/QuotaRemaining" }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ComparisonSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      operationId: externalCreateComparison
      tags: [commercial]
      summary: Create a metered tenant comparison
      description: Requires an API key with the comparisons:write scope, an Idempotency-Key, and a UUID X-Request-Id. Submit a persisted, user-confirmed draft by supplying draftId, draftVersion, explicit market, and comparisonValues. The completed response echoes draftId, draftVersion, and requestId. Only successful completed comparisons consume usage; retries with the same request are replayed.
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/DraftRequestId"
        - name: Idempotency-Key
          in: header
          required: true
          description: Unique key for this request; reusing it with a changed body returns 409.
          schema: { type: string, minLength: 8, maxLength: 255 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComparisonInput" }
            example:
              draftId: 00000000-0000-4000-8000-000000000001
              draftVersion: 3
              prompt: Compare Tesla Model 3 and BYD Seal for an Australian buyer with a A$50,000 budget.
              market: AU
              comparisonValues:
                - { rawText: Tesla Model 3, confirmedName: Tesla Model 3 }
                - { rawText: BYD Seal, confirmedName: BYD Seal }
              criteria: [Purchase price, Driving range, Warranty, Running costs]
              urls: []
      responses:
        "201":
          description: Completed comparison
          headers:
            RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
            RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
            RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
            X-Quota-Included: { $ref: "#/components/headers/QuotaIncluded" }
            X-Quota-Used: { $ref: "#/components/headers/QuotaUsed" }
            X-Quota-Remaining: { $ref: "#/components/headers/QuotaRemaining" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComparisonWithDraftCorrelation" }
              example:
                id: 142
                status: complete
                draftId: 00000000-0000-4000-8000-000000000001
                draftVersion: 3
                requestId: 00000000-0000-4000-8000-000000000002
                category: Electric vehicles
                recommendation: BYD Seal
                score: 84
                confirmedRecommendation:
                  status: CONFIRMED
                  option: BYD Seal
                  score: 84
                  basis: QUALIFIED
                  rationale: It remains within budget while preserving range and warranty value.
                alternatives:
                  - option: Tesla Model 3
                    rank: 1
                    score: 77
                    scoreDifference: 7
                    qualificationStatus: QUALIFIED
                    rationale: Strong technology, above budget
                executiveSummary: BYD Seal provides the stronger budget fit.
                recommendationReason: It remains within budget while preserving range and warranty value.
                vendors: [Tesla Model 3, BYD Seal]
                vendorScores:
                  - { vendor: Tesla Model 3, score: 77, verdict: Strong technology, above budget }
                  - { vendor: BYD Seal, score: 84, verdict: Best overall fit }
                nextSteps: [Confirm drive-away pricing, Book both test drives]
                urls: [https://www.tesla.com/en_au/model3, https://www.bydautomotive.com.au/seal]
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "402": { $ref: "#/components/responses/QuotaExceeded" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/BadGateway" }
    parameters: []
